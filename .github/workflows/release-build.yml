name: Build package (release + manual)

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "*.*.*-rc.*"
  workflow_dispatch:
    inputs:
      pretend_version:
        description: "Optional: override version for manual test (e.g. 0.0.0-test1)"
        required: false
        type: string
      tag_like_release:
        description: "Create a temporary git tag in the job (instead of pretend version)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write 
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout (need tags for setuptools-scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BASE_VERSION="$TAG_NAME"

          if [[ "$BASE_VERSION" == *-rc.* ]]; then
            RC_NUM=$(echo "$BASE_VERSION" | grep -oE 'rc\.([0-9]+)$' | grep -oE '[0-9]+$')
            BASE_VERSION=$(echo "$BASE_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=${BASE_VERSION}rc${RC_NUM}" >> $GITHUB_ENV
          else
            BASE_VERSION="${BASE_VERSION#v}"
            BASE_VERSION=$(echo "$BASE_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          fi

      # ----- Manual test helpers (only on workflow_dispatch) -----
      - name: Set pretend version via env
        if: github.event_name == 'workflow_dispatch' && inputs.pretend_version != ''
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.pretend_version }}" >> $GITHUB_ENV

      - name: Create a temporary tag (alternative to pretend version)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_like_release == true
        run: |
          # Use provided pretend_version or fallback
          VERSION="${{ inputs.pretend_version }}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0rc1"; fi
          git tag -a "v$VERSION" -m "temp test tag v$VERSION"
          git describe --tags --always

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build setuptools-scm

      # ── Bundled firmware from the firmware repos' releases ───────
      # rc tags and next builds take each repo's latest pre-release
      # (when it is at least as new as the latest stable); everything
      # else -- and rc/next builds with no usable pre-release -- takes
      # the latest stable release. The dfu-stub and legacy-updater
      # images have no publishing CI and stay as committed.
      - name: Resolve firmware releases
        id: fw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resolve() {
            local repo="$1" REL PRE TAG KIND
            REL=$(gh release list --repo "$repo" --json tagName,isPrerelease \
                  --jq 'map(select(.isPrerelease | not)) | .[0].tagName // empty')
            PRE=$(gh release list --repo "$repo" --json tagName,isPrerelease \
                  --jq 'map(select(.isPrerelease)) | .[0].tagName // empty')
            TAG="$REL"
            KIND="release"
            if [[ "${GITHUB_REF_NAME}" == "next" || "${GITHUB_REF_NAME}" =~ -rc\.[0-9]+$ ]]; then
              # semver compare: '-rc.' -> '~rc.' makes sort -V rank a pre-release
              # below its own stable release but above older ones.
              if [ -n "$PRE" ] && { [ -z "$REL" ] || \
                   [ "$(printf '%s\n' "${PRE/-rc./~rc.}" "$REL" | sort -V | tail -n1)" = "${PRE/-rc./~rc.}" ]; }; then
                TAG="$PRE"
                KIND="pre-release"
              fi
            fi
            if [ -z "$TAG" ]; then
              echo "::error::No release found in ${repo}." >&2
              return 1
            fi
            echo "${repo}: $KIND @ $TAG (stable='${REL:-none}' pre-release='${PRE:-none}')" >&2
            printf '%s' "$TAG"
          }
          CONSOLE_TAG=$(resolve OpenwaterHealth/openlifu-console-fw)
          TRANSMITTER_TAG=$(resolve OpenwaterHealth/openlifu-transmitter-fw)
          echo "console=$CONSOLE_TAG" >> "$GITHUB_OUTPUT"
          echo "transmitter=$TRANSMITTER_TAG" >> "$GITHUB_OUTPUT"

      - name: Pull firmware binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FW_DIR=src/openlifu_sdk/firmware
          gh release download "${{ steps.fw.outputs.console }}" \
            --repo OpenwaterHealth/openlifu-console-fw --dir "$FW_DIR" --clobber \
            --pattern 'openlifu-console-fw-signed.bin' \
            --pattern 'openlifu-console-fw-production.bin'
          gh release download "${{ steps.fw.outputs.transmitter }}" \
            --repo OpenwaterHealth/openlifu-transmitter-fw --dir "$FW_DIR" --clobber \
            --pattern 'openlifu-transmitter-fw-signed.bin' \
            --pattern 'openlifu-transmitter-fw-production.bin'
          ls -l "$FW_DIR"

      - name: Build sdist & wheel
        run: python -m build

      # ---------------------------
      # Create GitHub Release (tags only)
      # ---------------------------
      - name: Detect release type
        if: startsWith(github.ref, 'refs/tags/')
        id: reltype
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Capture build metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: buildmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          : > notes.md

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ "${{ steps.reltype.outputs.prerelease }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          PREV_TAG=$(git tag --merged HEAD --sort=-creatordate \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            | grep -v "^${TAG_NAME}$" \
            | head -n 1)

          if [ -n "$PREV_TAG" ]; then
            echo "Changes since ${PREV_TAG}:" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" >> notes.md
          else
            echo "Changes:" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s" >> notes.md
          fi

          echo "" >> notes.md
          echo "Sha: ${{ steps.buildmeta.outputs.sha }}" >> notes.md
          echo "Built: ${{ steps.buildmeta.outputs.datetime }}" >> notes.md

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          bodyFile: notes.md
          artifacts: dist/*
          artifactErrorsFailBuild: true
          prerelease: ${{ steps.reltype.outputs.prerelease }}
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # For manual runs, save artifacts to the workflow run instead
      - name: Upload artifacts to run (manual tests)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
