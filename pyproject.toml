[build-system]
requires = ["setuptools>=77.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "openlifu-sdk"
dynamic = ["version"]
authors = [
  { name = "George Vigelette", email = "george@openwater.health" },
]
description = "Openwater LIFU SDK — hardware I/O interface library"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.3",
  "xarray==2026.7.0",
  "pyserial==3.5",
  "pyusb==1.3.1",
  "base58==2.1.1"
]

[project.optional-dependencies]
crypto = [
  "cryptography==46.0.5",
]
test = [
  "pytest>=6",
  "pytest-cov>=3",
  "pytest-mock",
]
dev = [
  "pytest>=6",
  "pytest-cov>=3",
  "pytest-mock",
  "cryptography==46.0.5",
]
ui = [
  "PyQt6==6.11.0",
  "packaging==26.2",
  "requests==2.34.2",
]


[project.urls]
Homepage = "https://github.com/OpenwaterHealth/openlifu-sdk"
"Bug Tracker" = "https://github.com/OpenwaterHealth/openlifu-sdk/issues"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openlifu_sdk = [
  "py.typed",
  "firmware/*.bin",
  "libusb/win64/*.dll",
  "libusb/win32/*.dll",
]


[tool.setuptools_scm]
# The version comes from the git tag, verbatim. Accepts release and
# pre-release tags with optional pre-/v prefixes, e.g.:
#   1.2.3  v1.2.3  pre-v1.2.3  2.0.15-rc.0  2.0.15rc0  1.2.3.post1
# The captured part is normalized per PEP 440 (2.0.15-rc.0 -> 2.0.15rc0).
tag_regex = "^(?:pre-)?v?(?P<version>\\d+\\.\\d+\\.\\d+(?:[-._]?(?:rc|a|b|c|alpha|beta|post|dev)[-._]?\\d*)?)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
# Bake the resolved version into the package so openlifu_sdk.__version__
# always matches the wheel that was actually imported.
version_file = "src/openlifu_sdk/_version.py"